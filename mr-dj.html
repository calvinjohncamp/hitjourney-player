<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
<meta content="#06141F" name="theme-color"/>
<title>Mr. DJ · hitjourney</title>
<!-- Version: mr-dj-v1.0 -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#06141F;color:#f1ecdf;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}

/* ── Header ── */
.hj-header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 10px;flex-shrink:0;border-bottom:1px solid rgba(133,172,201,.12);min-height:48px;background:#06141F;position:relative;z-index:10}
.hj-logo{display:flex;align-items:flex-end;gap:0;cursor:pointer;line-height:1;text-decoration:none}
.hj-logo-hit{font-size:28px;font-weight:800;color:#cfe5f5;letter-spacing:-.5px}
.hj-logo-journey{font-size:28px;font-weight:800;color:#5884A4;letter-spacing:-.5px}
.back-btn{display:flex;align-items:center;gap:6px;color:#85ACC9;font-size:13px;font-weight:600;cursor:pointer;padding:4px 0;-webkit-tap-highlight-color:transparent}
.back-btn svg{width:18px;height:18px;stroke:#85ACC9;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.header-title{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(133,172,201,.5)}

/* ── Main Layout ── */
.dj-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}

/* ── Top Zone: Two Decks + Controls ── */
.dj-top{display:grid;grid-template-columns:1fr 280px 1fr;gap:0;flex-shrink:0;height:320px;border-bottom:1px solid rgba(133,172,201,.1)}

/* ── Decks ── */
.deck{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;background:#06141F;overflow:hidden;transition:background .3s}
.deck.active-deck{background:#071824}
.deck-glow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
.deck-a .deck-glow{background:radial-gradient(ellipse at 50% 50%,rgba(88,132,164,.06) 0%,transparent 70%)}
.deck-b .deck-glow{background:radial-gradient(ellipse at 50% 50%,rgba(88,132,164,.06) 0%,transparent 70%)}
.deck.active-deck .deck-glow{opacity:1}

/* Active deck ring — pulsing blue border */
.deck::after{content:'';position:absolute;inset:0;border:2px solid transparent;pointer-events:none;transition:border-color .3s;border-radius:0}
.deck.active-deck::after{border-color:rgba(133,172,201,.3);animation:deckPulse 2.5s ease-in-out infinite}
@keyframes deckPulse{0%,100%{border-color:rgba(133,172,201,.3)}50%{border-color:rgba(133,172,201,.08)}}

/* Drop zone highlight */
.deck.drag-over{background:#0B2234!important}
.deck.drag-over::after{border-color:rgba(133,172,201,.7)!important;animation:none!important}

/* Deck label */
.deck-label{position:absolute;top:8px;left:12px;font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(133,172,201,.3);z-index:2}
.deck.active-deck .deck-label{color:rgba(133,172,201,.7)}

/* Turntable */
.turntable{position:relative;width:clamp(140px,17vw,200px);height:clamp(140px,17vw,200px);flex-shrink:0;cursor:pointer}
.tt-base{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 50%,#1a2a38 0%,#0d1e2b 50%,#091620 100%);border:2px solid rgba(133,172,201,.12);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.deck.active-deck .tt-base{border-color:rgba(133,172,201,.35);box-shadow:0 0 28px rgba(88,132,164,.2)}
.tt-grooves{position:absolute;inset:4px;border-radius:50%;border:1px solid rgba(133,172,201,.04);box-shadow:inset 0 0 0 8px rgba(133,172,201,.03),inset 0 0 0 16px rgba(133,172,201,.02),inset 0 0 0 24px rgba(133,172,201,.015)}
.tt-cover{position:absolute;width:52%;height:52%;border-radius:50%;overflow:hidden;object-fit:cover;z-index:2}
.tt-cover img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.tt-cover-default{width:100%;height:100%;border-radius:50%;background:#0d1e2b;display:flex;align-items:center;justify-content:center}
.tt-cover-default svg{width:40%;height:40%;stroke:rgba(133,172,201,.2);stroke-width:1.5;fill:none}
.tt-spindle{position:absolute;width:8px;height:8px;border-radius:50%;background:#85ACC9;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%)}
.tt-arm{position:absolute;top:8%;right:12%;width:3px;height:55%;background:linear-gradient(to bottom,#85ACC9,rgba(133,172,201,.4));border-radius:2px;transform-origin:top center;transform:rotate(-15deg);z-index:6;transition:transform .6s ease}
.deck.active-deck .tt-arm{transform:rotate(-5deg)}
@keyframes ttSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.tt-base.spinning .tt-cover{animation:ttSpin 1.8s linear infinite}

/* Deck song info */
.deck-song{text-align:center;margin-top:10px;width:100%;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:3px}
.deck-song-title{font-size:13px;font-weight:700;color:#cfe5f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.deck-song-artist{font-size:11px;color:rgba(133,172,201,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.deck-song-empty{font-size:12px;color:rgba(133,172,201,.25);font-style:italic}

/* Drop hint */
.deck-drop-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.06em;color:rgba(133,172,201,.5);pointer-events:none;opacity:0;transition:opacity .2s;text-transform:uppercase}
.deck.drag-over .deck-drop-hint{opacity:1}

/* ── Center Controls ── */
.dj-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px 8px;background:#06141F;border-left:1px solid rgba(133,172,201,.07);border-right:1px solid rgba(133,172,201,.07)}

/* Progress bar between decks */
.dj-progress-wrap{width:100%;position:relative;cursor:pointer}
.dj-progress-track{height:4px;background:rgba(133,172,201,.12);border-radius:2px;width:100%;position:relative;overflow:hidden}
.dj-progress-fill{height:100%;background:linear-gradient(to right,#5884A4,#85ACC9);width:0%;border-radius:2px;transition:width .5s linear}
.dj-time-row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.dj-time{font-size:10px;font-weight:700;color:rgba(133,172,201,.5);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.dj-time.dj-remain{text-align:right;color:rgba(133,172,201,.4)}

/* Big crossfade button */
.btn-crossfade{width:60px;height:60px;border-radius:50%;border:none;background:radial-gradient(circle at 50% 35%,#ff4444,#cc1111);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s,box-shadow .15s;box-shadow:0 4px 18px rgba(200,20,20,.35),inset 0 1px 0 rgba(255,255,255,.15);flex-shrink:0}
.btn-crossfade:active{transform:scale(.93)}
.btn-crossfade:hover{box-shadow:0 6px 24px rgba(200,20,20,.5),inset 0 1px 0 rgba(255,255,255,.15)}
.btn-crossfade svg{width:22px;height:22px;fill:rgba(255,255,255,.9);stroke:none}

/* Fade indicator ring during crossfade */
.btn-crossfade.fading{animation:fadePulse .8s ease-in-out infinite}
@keyframes fadePulse{0%,100%{box-shadow:0 4px 18px rgba(200,20,20,.35),0 0 0 0 rgba(255,80,80,.4)}50%{box-shadow:0 4px 18px rgba(200,20,20,.5),0 0 0 8px rgba(255,80,80,0)}}

/* Play/Pause */
.btn-playpause{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(133,172,201,.3);background:rgba(11,42,66,.5);color:#85ACC9;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.btn-playpause:hover{background:rgba(11,42,66,.9);border-color:rgba(133,172,201,.6);color:#cfe5f5}
.btn-playpause:active{transform:scale(.93)}
.btn-playpause svg{width:18px;height:18px}
.btn-playpause .icon-pause{display:none}
.btn-playpause.playing .icon-play{display:none}
.btn-playpause.playing .icon-pause{display:block}

/* Shuffle button */
.btn-shuffle{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(133,172,201,.2);background:transparent;color:rgba(133,172,201,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.btn-shuffle:hover{color:#85ACC9;border-color:rgba(133,172,201,.45)}
.btn-shuffle:active{transform:scale(.93)}
.btn-shuffle.active{color:#cfe5f5;border-color:rgba(133,172,201,.7);background:rgba(133,172,201,.1)}
.btn-shuffle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Crossfade duration */
.fade-dur-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.fade-dur-label{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(133,172,201,.35)}
.fade-dur-val{font-size:13px;font-weight:800;color:#85ACC9;font-variant-numeric:tabular-nums}
.fade-dur-slider{width:100%;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:rgba(133,172,201,.15);outline:none;cursor:pointer}
.fade-dur-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#85ACC9;cursor:pointer;border:2px solid #06141F}
.fade-dur-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#85ACC9;cursor:pointer;border:2px solid #06141F}

/* Center label */
.center-label{font-size:8px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(133,172,201,.2)}

/* ── Bottom Zone ── */
.dj-bottom{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:0;overflow:hidden;border-top:1px solid rgba(133,172,201,.08)}

/* ── Left Bottom: Albums + Alpha + Search ── */
.dj-left{display:flex;flex-direction:column;border-right:1px solid rgba(133,172,201,.08);overflow:hidden}

/* Album grid */
.album-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:8px;flex-shrink:0;background:#06141F}
.album-thumb{position:relative;aspect-ratio:1/1;border-radius:5px;overflow:hidden;cursor:pointer;background:#0B2234;transition:transform .12s,opacity .12s}
.album-thumb:active{transform:scale(.95);opacity:.85}
.album-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.album-thumb-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0B1E2D}
.album-thumb-empty svg{width:50%;height:50%;stroke:rgba(133,172,201,.15);stroke-width:1.5;fill:none}
.album-thumb.active-source{outline:2px solid #85ACC9}

/* Alpha nav */
.alpha-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;padding:4px 8px;flex-shrink:0;border-top:1px solid rgba(133,172,201,.06);border-bottom:1px solid rgba(133,172,201,.06);background:#06141F}
.alpha-btn{width:26px;height:26px;border-radius:4px;border:none;background:transparent;color:#5884A4;font-family:'Anton',sans-serif;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .12s,background .12s}
.alpha-btn:hover{color:#cfe5f5;background:rgba(133,172,201,.1)}
.alpha-btn.active{color:#cfe5f5;background:rgba(133,172,201,.15)}
.alpha-btn.dim{color:rgba(88,132,164,.25)}

/* Search */
.dj-search-wrap{display:flex;align-items:center;gap:8px;padding:6px 8px;flex-shrink:0;border-bottom:1px solid rgba(133,172,201,.06)}
.dj-search-input{flex:1;background:rgba(11,42,66,.6);border:1px solid rgba(133,172,201,.15);border-radius:8px;padding:7px 10px;color:#f1ecdf;font-size:13px;outline:none;caret-color:#85ACC9}
.dj-search-input::placeholder{color:rgba(133,172,201,.3)}
.dj-search-input:focus{border-color:rgba(133,172,201,.35)}
.dj-search-clear{color:rgba(133,172,201,.4);cursor:pointer;font-size:16px;display:none;padding:0 4px;flex-shrink:0}
.dj-search-clear.visible{display:block}

/* Song list (search results / alpha) */
.dj-songlist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dj-songlist::-webkit-scrollbar{display:none}
.dj-song-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-bottom:1px solid rgba(133,172,201,.04);cursor:grab;transition:background .1s;user-select:none;-webkit-user-select:none}
.dj-song-row:active{cursor:grabbing;background:rgba(133,172,201,.08)}
.dj-song-row:hover{background:rgba(133,172,201,.04)}
.dj-song-row.dragging{opacity:.4;background:rgba(133,172,201,.1)}
.dj-song-thumb{width:32px;height:32px;border-radius:4px;object-fit:cover;flex-shrink:0;background:#0B2234}
.dj-song-info{flex:1;min-width:0}
.dj-song-title{font-size:12px;font-weight:600;color:#cfe5f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dj-song-artist{font-size:10px;color:rgba(133,172,201,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dj-song-drag{width:16px;height:16px;flex-shrink:0;color:rgba(133,172,201,.2)}
.dj-song-drag svg{width:100%;height:100%;stroke:currentColor;stroke-width:2;fill:none}

/* Empty state */
.dj-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:rgba(133,172,201,.25);font-size:12px;text-align:center;padding:20px}
.dj-empty svg{width:32px;height:32px;stroke:currentColor;stroke-width:1.5;fill:none;opacity:.4}

/* ── Right Bottom: Next List ── */
.dj-right{display:flex;flex-direction:column;overflow:hidden}
.dj-next-header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 6px;flex-shrink:0;border-bottom:1px solid rgba(133,172,201,.1);background:#06141F}
.dj-next-title{font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#85ACC9}
.dj-next-count{font-size:10px;color:rgba(133,172,201,.4);font-weight:600}
.dj-next-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1.5px solid rgba(88,132,164,.2);border-top:none;border-bottom:none}
.dj-next-list::-webkit-scrollbar{display:none}

/* Next list — drop zone */
.dj-next-list.drag-over{background:rgba(11,42,66,.4)}

.dj-next-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid rgba(133,172,201,.05);cursor:grab;user-select:none;-webkit-user-select:none;transition:background .1s;position:relative}
.dj-next-row:hover{background:rgba(133,172,201,.04)}
.dj-next-row:active{cursor:grabbing}
.dj-next-row.dragging{opacity:.3}
.dj-next-row.drag-target-above::before{content:'';position:absolute;top:-1px;left:8px;right:8px;height:2px;background:#85ACC9;border-radius:1px}
.dj-next-num{width:20px;font-size:11px;font-weight:800;color:rgba(133,172,201,.35);text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.dj-next-num.num-1{color:#85ACC9}
.dj-next-thumb{width:30px;height:30px;border-radius:4px;object-fit:cover;flex-shrink:0;background:#0B2234}
.dj-next-info{flex:1;min-width:0}
.dj-next-title-text{font-size:12px;font-weight:600;color:#cfe5f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dj-next-artist-text{font-size:10px;color:rgba(133,172,201,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dj-next-del{width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:rgba(133,172,201,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:color .12s,background .12s;padding:0}
.dj-next-del:hover{color:rgba(220,80,80,.7);background:rgba(220,80,80,.1)}
.dj-next-del svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round}

/* Deck-drop zones in next list area */
.next-deck-drop{display:none;align-items:center;gap:6px;padding:6px 10px;background:rgba(11,42,66,.5);border-top:1px solid rgba(133,172,201,.08);cursor:default;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(133,172,201,.35);flex-shrink:0}
.next-deck-drop.visible{display:flex}
.next-deck-drop.drop-active{background:rgba(11,42,66,.9);color:#85ACC9;border-color:rgba(133,172,201,.35)}

/* Loading overlay */
.dj-loading{position:absolute;inset:0;background:rgba(6,20,31,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:100;backdrop-filter:blur(4px)}
.dj-loading-spinner{width:32px;height:32px;border:3px solid rgba(133,172,201,.15);border-top-color:#85ACC9;border-radius:50%;animation:spin .7s linear infinite}
.dj-loading-text{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(133,172,201,.5)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
#djToast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);z-index:9999;background:#0B2A42;border:1px solid rgba(133,172,201,.3);border-radius:8px;padding:8px 16px;font-size:12px;font-weight:700;color:#cfe5f5;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;letter-spacing:.04em}
#djToast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Auto-fade warning flash */
.btn-crossfade.auto-warning{animation:warningFlash .4s ease-in-out 3}
@keyframes warningFlash{0%,100%{box-shadow:0 4px 18px rgba(200,20,20,.35)}50%{box-shadow:0 0 0 12px rgba(255,80,80,.3),0 4px 18px rgba(200,20,20,.5)}}

/* Responsive tweaks */
@media(max-width:900px){
  .dj-top{grid-template-columns:1fr 220px 1fr;height:280px}
  .album-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:700px){
  .dj-top{grid-template-columns:1fr 180px 1fr;height:240px}
  .album-grid{grid-template-columns:repeat(3,1fr)}
  .turntable{width:clamp(100px,22vw,160px);height:clamp(100px,22vw,160px)}
}
</style>
</head>
<body>

<!-- Header -->
<header class="hj-header">
  <div class="back-btn" id="djBackBtn" onclick="history.back()">
    <svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"></polyline></svg>
    hitjourney
  </div>
  <div class="header-title">Mr. DJ</div>
</header>

<!-- Main DJ Interface -->
<div class="dj-wrap" id="djWrap" style="position:relative">

  <!-- Loading -->
  <div class="dj-loading" id="djLoading">
    <div class="dj-loading-spinner"></div>
    <div class="dj-loading-text">Lade Songs …</div>
  </div>

  <!-- TOP ZONE: Deck A | Controls | Deck B -->
  <div class="dj-top">

    <!-- DECK A -->
    <div class="deck deck-a active-deck" id="deckA"
         ondragover="handleDeckDragOver(event,'A')" ondragleave="handleDeckDragLeave(event,'A')" ondrop="handleDeckDrop(event,'A')"
         onclick="handleDeckClick('A')">
      <div class="deck-glow"></div>
      <div class="deck-label">DECK A</div>
      <div class="turntable" id="ttA">
        <div class="tt-base" id="ttBaseA">
          <div class="tt-grooves"></div>
          <div class="tt-cover" id="ttCoverA">
            <div class="tt-cover-default" id="ttCoverDefaultA">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
            </div>
            <img id="ttCoverImgA" alt="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%"/>
          </div>
          <div class="tt-spindle"></div>
        </div>
        <div class="tt-arm"></div>
      </div>
      <div class="deck-song" id="deckSongA">
        <div class="deck-song-empty">Drag & Drop</div>
      </div>
      <div class="deck-drop-hint">Song hierher ziehen</div>
    </div>

    <!-- CENTER CONTROLS -->
    <div class="dj-center">
      <div class="center-label">now playing</div>

      <!-- Progress -->
      <div class="dj-progress-wrap" id="djProgressWrap">
        <div class="dj-progress-track">
          <div class="dj-progress-fill" id="djProgressFill"></div>
        </div>
        <div class="dj-time-row">
          <span class="dj-time" id="djElapsed">0:00</span>
          <span class="dj-time dj-remain" id="djRemain">—</span>
        </div>
      </div>

      <!-- Play/Pause -->
      <button class="btn-playpause" id="btnPlayPause" aria-label="Play / Pause" onclick="togglePlayPause()">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>

      <!-- Crossfade button -->
      <button class="btn-crossfade" id="btnCrossfade" aria-label="Crossfade" onclick="triggerManualCrossfade()">

<script>
// ═══════════════════════════════════════════════════════
// SUPABASE CONFIG (same as index.html)
// ═══════════════════════════════════════════════════════
const SB_URL  = 'https://hioaqcwqzeqcvvikollq.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhpb2FxY3dxemVxY3Z2aWtvbGxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNTQ3MTgsImV4cCI6MjA4NzkzMDcxOH0.IvZ7YZwrhjNg8SwwO9rnXoiDwOVncY8iVcucmipmuFI';

const PLAYLIST_MAP = {
  'songwriters-picks': { key:'top50',        title:'Top 50',         cover:'https://hitjourney.s3.eu-west-1.amazonaws.com/artwork/top50-cover.jpg' },
  '30-grad':           { key:'grad30',        title:'30° Grad',       cover:'https://hitjourney.s3.eu-west-1.amazonaws.com/artwork/30%20Grad%20-%20Cover.jpg' },
  '30-stories':        { key:'stories30',     title:'30 Stories',     cover:'https://hitjourney.s3.eu-west-1.amazonaws.com/artwork/30%20stories%20-%20Cover.jpg' },
  'grosse-liebe':      { key:'grosseLiebe',   title:'Grosse Liebe',   cover:'https://hitjourney.s3.eu-west-1.amazonaws.com/artwork/grosse-liebe-cover.jpg' },
  'poesie':            { key:'poesie',         title:'Poesie',         cover:'https://hitjourney.s3.eu-west-1.amazonaws.com/artwork/poesie-cover.jpg' },
  'buried-diamonds':   { key:'buriedDiamonds', title:'Buried Diamonds',cover:'https://hitjourney.s3.eu-west-1.amazonaws.com/artwork/Buried%20Diamonds%20-%20Cover.jpg' },
  'top-100':           { key:'top100',         title:'Top 100',        cover:'https://hitjourney.s3.eu-west-1.amazonaws.com/artwork/top100-cover.jpg' },
};

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let allSongs = [];
let albums   = {}; // key -> { title, cover, songs[] }

// Deck state
const decks = {
  A: { song: null, audio: null, ready: false },
  B: { song: null, audio: null, ready: false }
};
let activeDeck = 'A';   // which deck is currently playing
let isPlaying  = false;
let shuffleOn  = false;
let fadeDur    = 5;      // seconds

// Next list
let nextList = [];

// Crossfade state
let isCrossfading = false;
let crossfadeTimer = null;
let autoFadeScheduled = false;
let autoFadeRafId = null;

// Drag state
let dragSource = null; // { type:'song'|'next', song, nextIdx }

// UI refs
const audioA      = document.getElementById('audioA');
const audioB      = document.getElementById('audioB');
const djLoading   = document.getElementById('djLoading');
const djProgress  = document.getElementById('djProgressFill');
const djElapsed   = document.getElementById('djElapsed');
const djRemain    = document.getElementById('djRemain');
const btnPlay     = document.getElementById('btnPlayPause');
const btnCross    = document.getElementById('btnCrossfade');
const djNextList  = document.getElementById('djNextList');
const djNextCount = document.getElementById('djNextCount');
const djSonglist  = document.getElementById('djSonglist');

decks.A.audio = audioA;
decks.B.audio = audioB;

// ═══════════════════════════════════════════════════════
// SUPABASE LOAD
// ═══════════════════════════════════════════════════════
async function loadData(){
  const headers = { 'apikey':SB_ANON, 'Authorization':'Bearer '+SB_ANON };
  try {
    const [songsRes, plRes, trRes] = await Promise.all([
      fetch(SB_URL+'/rest/v1/songs?select=slug,title,artist,language,mp3_url,cover_url&order=title', {headers}),
      fetch(SB_URL+'/rest/v1/playlists?select=slug,title,cover_url&order=title.asc', {headers}),
      fetch(SB_URL+'/rest/v1/playlist_tracks?select=song_slug,playlist_slug,position&order=playlist_slug,position', {headers})
    ]);
    const songsRaw    = await songsRes.json();
    const playlistsRaw = await plRes.json();
    const tracksRaw    = await trRes.json();

    const songMap = {};
    allSongs = [];
    songsRaw.forEach(row => {
      const s = { slug:row.slug, title:row.title, artist:row.artist||'', mp3:row.mp3_url, cover:row.cover_url||'', language:row.language||'' };
      songMap[row.slug] = s;
      allSongs.push(s);
    });

    // Build albums from playlists
    const plInfoBySlug = {};
    Object.entries(PLAYLIST_MAP).forEach(([slug,info]) => { plInfoBySlug[slug] = {...info,slug}; });
    playlistsRaw.forEach(pl => {
      const known = PLAYLIST_MAP[pl.slug];
      plInfoBySlug[pl.slug] = { slug:pl.slug, key:known?known.key:pl.slug, title:pl.title||(known&&known.title)||pl.slug, cover:pl.cover_url||(known&&known.cover)||'' };
    });

    albums = {};
    tracksRaw.forEach(row => {
      const info = plInfoBySlug[row.playlist_slug]; if(!info) return;
      const song = songMap[row.song_slug]; if(!song) return;
      if(!albums[info.key]) albums[info.key] = { title:info.title, cover:info.cover, songs:[] };
      albums[info.key].songs.push(song);
    });

    // Remove empties
    Object.keys(albums).forEach(k => { if(!albums[k].songs.length) delete albums[k]; });

    djLoading.style.display = 'none';
    buildAlbumGrid();
    buildAlphaNav();
    renderSongList(allSongs);
  } catch(e) {
    console.error('[Mr.DJ] Load error:', e);
    djLoading.querySelector('.dj-loading-text').textContent = 'Ladefehler';
  }
}

// ═══════════════════════════════════════════════════════
// ALBUM GRID
// ═══════════════════════════════════════════════════════
function buildAlbumGrid(){
  const grid = document.getElementById('djAlbumGrid');
  grid.innerHTML = '';
  Object.entries(albums).forEach(([key, alb]) => {
    const div = document.createElement('div');
    div.className = 'album-thumb';
    div.title = alb.title;
    div.dataset.key = key;
    if(alb.cover){
      const img = document.createElement('img');
      img.src = alb.cover; img.alt = alb.title; img.loading = 'lazy';
      div.appendChild(img);
    } else {
      div.innerHTML = '<div class="album-thumb-empty"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg></div>';
    }
    div.addEventListener('click', () => selectAlbumSource(key, div));
    grid.appendChild(div);
  });
}

function selectAlbumSource(key, el){
  document.querySelectorAll('.album-thumb').forEach(t=>t.classList.remove('active-source'));
  el.classList.add('active-source');
  clearSearch();
  clearAlpha();
  renderSongList(albums[key]?.songs || []);
}

// ═══════════════════════════════════════════════════════
// ALPHA NAV
// ═══════════════════════════════════════════════════════
const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let activeAlpha = null;

function buildAlphaNav(){
  const nav = document.getElementById('djAlphaNav');
  nav.innerHTML = '';
  ALPHA.forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'alpha-btn';
    btn.textContent = letter;
    btn.dataset.letter = letter;
    const has = allSongs.some(s => s.title && s.title.toUpperCase().startsWith(letter));
    if(!has) btn.classList.add('dim');
    btn.addEventListener('click', () => selectAlpha(letter, btn));
    nav.appendChild(btn);
  });
}

function selectAlpha(letter, btn){
  if(activeAlpha === letter){ clearAlpha(); renderSongList(allSongs); return; }
  activeAlpha = letter;
  document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.album-thumb').forEach(t=>t.classList.remove('active-source'));
  clearSearch();
  renderSongList(allSongs.filter(s => s.title && s.title.toUpperCase().startsWith(letter)));
}

function clearAlpha(){
  activeAlpha = null;
  document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
}

// ═══════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════
function handleSearch(val){
  const clear = document.getElementById('djSearchClear');
  if(val.trim()){
    clear.classList.add('visible');
    clearAlpha();
    document.querySelectorAll('.album-thumb').forEach(t=>t.classList.remove('active-source'));
    const q = val.toLowerCase();
    renderSongList(allSongs.filter(s => s.title.toLowerCase().includes(q) || (s.artist||'').toLowerCase().includes(q)));
  } else {
    clear.classList.remove('visible');
    renderSongList(allSongs);
  }
}

function clearSearch(){
  const inp = document.getElementById('djSearchInput');
  inp.value = '';
  document.getElementById('djSearchClear').classList.remove('visible');
  if(activeAlpha) return;
  renderSongList(allSongs);
}

// ═══════════════════════════════════════════════════════
// SONG LIST
// ═══════════════════════════════════════════════════════
function renderSongList(songs){
  djSonglist.innerHTML = '';
  if(!songs.length){
    djSonglist.innerHTML = '<div class="dj-empty"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Keine Songs gefunden</div>';
    return;
  }
  songs.forEach(song => {
    const row = document.createElement('div');
    row.className = 'dj-song-row';
    row.draggable = true;
    row.innerHTML = `
      <img class="dj-song-thumb" src="${song.cover||''}" alt="" loading="lazy" onerror="this.style.background='#0B2234';this.style.display='block'"/>
      <div class="dj-song-info">
        <div class="dj-song-title">${esc(song.title)}</div>
        <div class="dj-song-artist">${esc(song.artist||'')}</div>
      </div>
      <div class="dj-song-drag" aria-hidden="true"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></div>`;

    row.addEventListener('dragstart', e => {
      dragSource = { type:'song', song };
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'copy';
    });
    row.addEventListener('dragend', () => { row.classList.remove('dragging'); dragSource = null; });

    // Double-tap / double-click → add to next list
    let lastTap = 0;
    row.addEventListener('click', () => {
      const now = Date.now();
      if(now - lastTap < 350){ addToNextList(song); showToast(song.title + ' → Next'); }
      lastTap = now;
    });

    djSonglist.appendChild(row);
  });
}

// ═══════════════════════════════════════════════════════
// NEXT LIST
// ═══════════════════════════════════════════════════════
function addToNextList(song, atIndex){
  if(atIndex !== undefined && atIndex >= 0 && atIndex <= nextList.length){
    nextList.splice(atIndex, 0, song);
  } else {
    nextList.push(song);
  }
  renderNextList();
  loadNextSongToIdleDeck();
}

function removeFromNextList(idx){
  nextList.splice(idx, 1);
  renderNextList();
  loadNextSongToIdleDeck();
}

function renderNextList(){
  djNextList.innerHTML = '';
  djNextCount.textContent = nextList.length + (nextList.length === 1 ? ' Song' : ' Songs');
  if(!nextList.length){
    djNextList.innerHTML = '<div class="dj-empty" style="height:100%"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Next-Liste leer<br><small style="font-size:10px;opacity:.6">Song doppeltippen oder hier ablegen</small></div>';
    return;
  }

  nextList.forEach((song, i) => {
    const row = document.createElement('div');
    row.className = 'dj-next-row';
    row.draggable = true;
    row.dataset.idx = i;
    row.innerHTML = `
      <span class="dj-next-num ${i===0?'num-1':''}">${i+1}</span>
      <img class="dj-next-thumb" src="${song.cover||''}" alt="" loading="lazy" onerror="this.style.background='#0B2234'"/>
      <div class="dj-next-info">
        <div class="dj-next-title-text">${esc(song.title)}</div>
        <div class="dj-next-artist-text">${esc(song.artist||'')}</div>
      </div>
      <button class="dj-next-del" aria-label="Entfernen" onclick="removeFromNextList(${i})"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;

    // Drag reorder within next list
    row.addEventListener('dragstart', e => {
      dragSource = { type:'next', song, nextIdx:i };
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      dragSource = null;
      document.querySelectorAll('.dj-next-row').forEach(r => r.classList.remove('drag-target-above'));
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      document.querySelectorAll('.dj-next-row').forEach(r => r.classList.remove('drag-target-above'));
      row.classList.add('drag-target-above');
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      e.stopPropagation();
      row.classList.remove('drag-target-above');
      if(!dragSource) return;
      const targetIdx = i;
      if(dragSource.type === 'next'){
        const fromIdx = dragSource.nextIdx;
        if(fromIdx === targetIdx) return;
        const item = nextList.splice(fromIdx, 1)[0];
        const insertAt = fromIdx < targetIdx ? targetIdx - 1 : targetIdx;
        nextList.splice(insertAt, 0, item);
      } else if(dragSource.type === 'song'){
        nextList.splice(targetIdx, 0, dragSource.song);
      }
      renderNextList();
      loadNextSongToIdleDeck();
    });

    djNextList.appendChild(row);
  });
}

// Next list drop zone (background)
function handleNextListDragOver(e){ e.preventDefault(); djNextList.classList.add('drag-over'); }
function handleNextListDragLeave(e){ djNextList.classList.remove('drag-over'); }
function handleNextListDrop(e){
  e.preventDefault();
  djNextList.classList.remove('drag-over');
  document.querySelectorAll('.dj-next-row').forEach(r => r.classList.remove('drag-target-above'));
  if(!dragSource) return;
  if(dragSource.type === 'song'){ addToNextList(dragSource.song); showToast(dragSource.song.title + ' → Next'); }
  else if(dragSource.type === 'next'){
    // Move to end
    const fromIdx = dragSource.nextIdx;
    const item = nextList.splice(fromIdx, 1)[0];
    nextList.push(item);
    renderNextList();
    loadNextSongToIdleDeck();
  }
}

// ═══════════════════════════════════════════════════════
// DECK MANAGEMENT
// ═══════════════════════════════════════════════════════
function idleDeck(){ return activeDeck === 'A' ? 'B' : 'A'; }

function loadSongToDeck(deckId, song){
  const d = decks[deckId];
  d.song = song;
  d.audio.src = song.mp3;
  d.audio.load();

  // Update turntable UI
  const coverImg = document.getElementById('ttCoverImg' + deckId);
  const coverDef = document.getElementById('ttCoverDefault' + deckId);
  if(song.cover){
    coverImg.src = song.cover;
    coverImg.style.display = 'block';
    coverDef.style.display = 'none';
  } else {
    coverImg.style.display = 'none';
    coverDef.style.display = 'flex';
  }

  // Update deck info
  const infoEl = document.getElementById('deckSong' + deckId);
  infoEl.innerHTML = `<div class="deck-song-title">${esc(song.title)}</div><div class="deck-song-artist">${esc(song.artist||'')}</div>`;
}

function loadNextSongToIdleDeck(){
  const idle = idleDeck();
  if(nextList.length > 0 && decks[idle].song !== nextList[0]){
    loadSongToDeck(idle, nextList[0]);
  }
}

// Deck click = toggle play on active deck
function handleDeckClick(deckId){
  if(deckId === activeDeck) togglePlayPause();
}

// ═══════════════════════════════════════════════════════
// PLAYBACK
// ═══════════════════════════════════════════════════════
function togglePlayPause(){
  if(!decks[activeDeck].song) return;
  const audio = decks[activeDeck].audio;
  if(isPlaying){
    audio.pause();
    isPlaying = false;
    updatePlayBtn();
    stopSpinning(activeDeck);
    cancelAutoFade();
  } else {
    audio.play().catch(e => console.warn('[Mr.DJ] play error:', e));
    isPlaying = true;
    updatePlayBtn();
    startSpinning(activeDeck);
    scheduleAutoFade();
  }
}

function updatePlayBtn(){
  btnPlay.classList.toggle('playing', isPlaying);
}

function startSpinning(deckId){
  document.getElementById('ttBase'+deckId).classList.add('spinning');
}
function stopSpinning(deckId){
  document.getElementById('ttBase'+deckId).classList.remove('spinning');
}

// ═══════════════════════════════════════════════════════
// PROGRESS & TIME
// ═══════════════════════════════════════════════════════
function fmt(s){ const m=Math.floor(s/60); return m+':'+(Math.floor(s%60)<10?'0':'')+Math.floor(s%60); }

setInterval(() => {
  if(!isPlaying || !decks[activeDeck].song) return;
  const audio = decks[activeDeck].audio;
  const cur = audio.currentTime || 0;
  const dur = audio.duration || 0;
  if(dur > 0){
    djProgress.style.width = (cur/dur*100).toFixed(2)+'%';
    djElapsed.textContent = fmt(cur);
    djRemain.textContent = '-'+fmt(dur-cur);
  }
}, 500);

// Seek on progress click
document.getElementById('djProgressWrap').addEventListener('click', e => {
  const audio = decks[activeDeck].audio;
  if(!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const frac = (e.clientX - rect.left) / rect.width;
  audio.currentTime = frac * audio.duration;
});

// ═══════════════════════════════════════════════════════
// CROSSFADE ENGINE
// ═══════════════════════════════════════════════════════
function triggerManualCrossfade(){
  if(isCrossfading) return;
  const idle = idleDeck();
  if(!decks[idle].song){ showToast('Kein Song auf Deck '+idle); return; }
  startCrossfade();
}

function startCrossfade(){
  if(isCrossfading) return;
  if(!decks[idleDeck()].song) return;

  isCrossfading = true;
  cancelAutoFade();
  btnCross.classList.add('fading');

  const from  = activeDeck;
  const to    = idleDeck();
  const dur   = fadeDur * 1000;
  const steps = 60;
  const interval = dur / steps;
  let step = 0;

  // Start target deck
  decks[to].audio.volume = 0;
  decks[to].audio.play().catch(()=>{});
  startSpinning(to);

  // Switch active indicator
  document.getElementById('deck'+from).classList.remove('active-deck');
  document.getElementById('deck'+to).classList.add('active-deck');

  const fadeInterval = setInterval(() => {
    step++;
    const t = step / steps;
    const eased = t < 0.5 ? 2*t*t : -1+(4-2*t)*t; // ease-in-out
    decks[from].audio.volume = Math.max(0, 1 - eased);
    decks[to].audio.volume   = Math.min(1, eased);

    if(step >= steps){
      clearInterval(fadeInterval);
      decks[from].audio.pause();
      decks[from].audio.volume = 1;
      decks[to].audio.volume   = 1;
      stopSpinning(from);

      // Swap active deck
      activeDeck = to;
      isCrossfading = false;
      btnCross.classList.remove('fading');

      // Pop from next list and load next
      if(nextList.length > 0 && decks[to].song === nextList[0]){
        nextList.shift();
        renderNextList();
      }

      isPlaying = true;
      updatePlayBtn();
      scheduleAutoFade();
      loadNextSongToIdleDeck();

      showToast('Übergeblendet zu Deck '+to);
    }
  }, interval);
}

// ═══════════════════════════════════════════════════════
// AUTO-FADE LOGIC
// ═══════════════════════════════════════════════════════
const AUTO_FADE_THRESHOLD_SEC = 15;
const VOLUME_THRESHOLD = 0.15; // natural fade-out detection

function scheduleAutoFade(){
  cancelAutoFade();
  autoFadeRafId = requestAnimationFrame(checkAutoFade);
}

function cancelAutoFade(){
  autoFadeScheduled = false;
  if(autoFadeRafId) cancelAnimationFrame(autoFadeRafId);
  autoFadeRafId = null;
}

function checkAutoFade(){
  if(!isPlaying){ return; }
  const audio = decks[activeDeck].audio;
  const dur = audio.duration || 0;
  const cur = audio.currentTime || 0;
  const remain = dur - cur;

  if(dur > 0 && remain <= AUTO_FADE_THRESHOLD_SEC && remain > 0 && !isCrossfading){
    // Check if there's something to fade to
    if(decks[idleDeck()].song){
      // Flash warning then start fade
      if(!autoFadeScheduled){
        autoFadeScheduled = true;
        btnCross.classList.add('auto-warning');
        setTimeout(()=> { btnCross.classList.remove('auto-warning'); startCrossfade(); }, 1200);
      }
      return;
    }
  }

  autoFadeRafId = requestAnimationFrame(checkAutoFade);
}

// Also listen for 'ended' as safety net
audioA.addEventListener('ended', onDeckEnded);
audioB.addEventListener('ended', onDeckEnded);

function onDeckEnded(){
  if(isCrossfading) return;
  const endedDeck = (this === audioA) ? 'A' : 'B';
  if(endedDeck !== activeDeck) return;

  // Try to load next from nextList if idle deck is empty
  if(!decks[idleDeck()].song && nextList.length > 0){
    loadSongToDeck(idleDeck(), nextList[0]);
  }

  if(decks[idleDeck()].song){
    startCrossfade();
  } else {
    // Nothing to play
    isPlaying = false;
    updatePlayBtn();
    stopSpinning(activeDeck);
  }
}

// ═══════════════════════════════════════════════════════
// DECK DROP
// ═══════════════════════════════════════════════════════
function handleDeckDragOver(e, deckId){
  e.preventDefault();
  if(deckId === activeDeck) return; // can't drop on playing deck
  document.getElementById('deck'+deckId).classList.add('drag-over');
}
function handleDeckDragLeave(e, deckId){
  document.getElementById('deck'+deckId).classList.remove('drag-over');
}
function handleDeckDrop(e, deckId){
  e.preventDefault();
  document.getElementById('deck'+deckId).classList.remove('drag-over');
  if(!dragSource) return;
  if(deckId === activeDeck){ showToast('Laufenden Deck nicht änderbar'); return; }

  let song = dragSource.song;
  if(dragSource.type === 'next' && dragSource.nextIdx !== undefined){
    // Remove from next list if dragged from there
    nextList.splice(dragSource.nextIdx, 1);
  }

  loadSongToDeck(deckId, song);

  // If this song was #1 in next list, remove it and shift
  if(nextList.length > 0 && nextList[0] === song){
    nextList.shift();
  }
  // Make it #1 in next list so Next list stays consistent
  nextList.unshift(song);
  renderNextList();

  showToast(song.title + ' → Deck '+deckId);
}

// ═══════════════════════════════════════════════════════
// SHUFFLE
// ═══════════════════════════════════════════════════════
function toggleShuffle(){
  shuffleOn = !shuffleOn;
  document.getElementById('btnShuffle').classList.toggle('active', shuffleOn);
  if(shuffleOn && nextList.length > 1){
    // Shuffle nextList preserving #1 (loaded on idle deck)
    const first = nextList.shift();
    for(let i = nextList.length - 1; i > 0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [nextList[i], nextList[j]] = [nextList[j], nextList[i]];
    }
    nextList.unshift(first);
    renderNextList();
    showToast('Next-Liste gemischt');
  }
}

// ═══════════════════════════════════════════════════════
// CROSSFADE DURATION
// ═══════════════════════════════════════════════════════
function updateFadeDur(val){
  fadeDur = parseInt(val);
  document.getElementById('fadeDurVal').textContent = fadeDur;
}

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function esc(s){ const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

let toastTimer;
function showToast(msg){
  const t = document.getElementById('djToast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
loadData();
renderNextList();
</script>
