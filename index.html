<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="hitjourney"/>
<meta name="theme-color" content="#06141F"/>
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/calvinjohncamp/hitjourney-player/main/icon.png"/>
<title>hitjourney</title>
<!-- Version: v15j-test-teaser -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:rgba(6,20,32,1);color:#f1ecdf;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:0}

/* ── Header ── */
.hj-header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 10px;flex-shrink:0;border-bottom:1px solid rgba(133,172,201,.12);min-height:48px;background:rgba(6,20,32,1);position:relative;z-index:10}
.hj-logo{display:flex;align-items:flex-end;gap:0;cursor:pointer;line-height:1;}
.hj-logo-hit{font-size:34px;font-weight:800;color:#cfe5f5;letter-spacing:-.5px}
.hj-logo-journey{font-size:34px;font-weight:800;color:#5884A4;letter-spacing:-.5px}
.hj-logo-sub{font-size:14px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:#85ACC9;line-height:1;padding-bottom:2px;margin-left:auto;align-self:flex-end;}
.hj-back-btn{display:none;align-items:center;gap:5px;color:#85ACC9;font-size:14px;cursor:pointer;padding:2px 0;z-index:1}
.hj-back-btn svg{width:18px;height:18px;stroke:#85ACC9;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hj-back-btn.visible{display:flex}
.hj-header-right{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(133,172,201,.5);z-index:1}

/* ── Screens ── */
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;min-height:0;scroll-padding-top:14px}
#screenHome{padding-top:14px}
#screenTracklist{padding-top:8px}
.screen.active{display:block}
.screen::-webkit-scrollbar{display:none}

/* ══ HOME ══ */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;padding-top:0}

.home-card{cursor:pointer;border-radius:8px;overflow:hidden;background:#0B2A42;transition:transform .13s,opacity .13s}
.home-card:active{transform:scale(.95);opacity:.85}
.home-card.wide{grid-column:1/-1}
.home-card img{width:100%;display:block;object-fit:cover}
.home-card.wide img{aspect-ratio:2/1}
.home-card.square img{aspect-ratio:1/1}
.home-bottom-pad{height:220px}

/* ══ ARCHIVE ══ */
#screenArchive{padding-top:0}
.arc-sticky{
  position:sticky;top:0;z-index:10;
  background:rgba(6,20,32,1);
  padding:10px 14px 0;
  box-shadow:0 4px 12px rgba(6,20,32,.9);
}
.arc-search{
  display:flex;align-items:center;gap:8px;
  background:#0B2A42;border-radius:10px;
  padding:8px 12px;margin-bottom:8px;
}
.arc-search svg{width:16px;height:16px;stroke:#85ACC9;stroke-width:2;fill:none;flex-shrink:0}
.arc-search input{
  flex:1;background:none;border:none;outline:none;
  color:#f1ecdf;font-size:15px;
  caret-color:#85ACC9;
}
.arc-search input::placeholder{color:rgba(133,172,201,.4)}
.arc-search .arc-clear{
  display:none;width:18px;height:18px;
  align-items:center;justify-content:center;
  color:rgba(133,172,201,.5);font-size:18px;cursor:pointer;line-height:1;
  flex-shrink:0;
}
.arc-search.has-value .arc-clear{display:flex}
.arc-letters{
  display:grid;
  grid-template-columns:repeat(9,1fr);
  gap:3px 2px;
  padding:0 0 10px;
}
.arc-letter{
  height:28px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;
  color:#85ACC9;
  border-radius:6px;cursor:pointer;
  transition:background .12s,color .12s;
  -webkit-tap-highlight-color:transparent;
}
.arc-letter:active,.arc-letter.active{background:rgba(133,172,201,.18);color:#cfe5f5}
.arc-letter.dim{opacity:0.3}
.arc-section-label{
  padding:10px 16px 4px 16px;
  font-size:12px;font-weight:700;
  color:#85ACC9;
  letter-spacing:.1em;text-transform:uppercase;
}
.arc-no-results{
  text-align:center;color:rgba(133,172,201,.35);
  font-size:15px;padding:40px 20px;
}
#arcList{max-width:680px;margin:0 auto;width:100%}

/* ══ TRACKLIST ══ */
/* Album header: cover centered, title+meta centered below */
.tl-top{
  display:flex;flex-direction:column;align-items:center;
  padding:20px 16px 16px;
  background:transparent;
  border-bottom:none;
  gap:12px;
  max-width:680px;
  margin:0 auto;
  width:100%;
}
.tl-top-cover{
  width:min(160px,40vw);height:min(160px,40vw);
  border-radius:8px;object-fit:cover;
  background:#0B2A42;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}
@media(min-width:600px){
  .tl-top-cover{width:160px;height:160px;}
  .tl-top{gap:14px;padding:24px 16px 16px;}
}
.tl-top-info{text-align:center;}
.tl-top-title{font-size:17px;font-weight:700;color:#cfe5f5;margin-bottom:4px;}
.tl-top-meta{font-size:12px;color:rgba(133,172,201,.6)}

/* Track rows — bigger, Spotify-sized */
.tl-track{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 32px;cursor:pointer;transition:background .12s}
.tl-track:active{background:rgba(133,172,201,.07)}
.tl-track.active{background:rgba(133,172,201,.06)}
.tl-num-wrap{width:28px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end}
.tl-track-num{font-size:16px;color:#85ACC9}
.tl-track.active .tl-track-num{display:none}
.tl-bars{display:none;align-items:flex-end;gap:2px;height:16px;width:28px;justify-content:flex-end}
.tl-track.active .tl-bars{display:flex}
.tl-bar{width:3px;background:#85ACC9;border-radius:1px;animation:bar .8s ease-in-out infinite alternate}
.tl-bar:nth-child(1){height:5px;animation-delay:0s}
.tl-bar:nth-child(2){height:13px;animation-delay:.15s}
.tl-bar:nth-child(3){height:8px;animation-delay:.3s}
.tl-bar:nth-child(4){height:15px;animation-delay:.1s}
@keyframes bar{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.tl-track.active:not(.playing) .tl-bar{animation:none;height:8px;opacity:.4}
.tl-thumb{width:62px;height:62px;border-radius:6px;object-fit:cover;flex-shrink:0;background:#0B2A42}
.tl-info{flex:1;min-width:0}
.tl-title{font-size:18px;font-weight:500;color:#f1ecdf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-track.active .tl-title{color:#85ACC9}
.tl-artist{font-size:14px;color:rgba(133,172,201,.45);margin-top:3px}
.tl-bottom-pad{height:220px}

/* Tracklist container: max-width for iPad readability */
#tlList{max-width:680px;margin:0 auto;width:100%}
#screenNowPlaying{
  background:rgba(6,20,32,1);
  display:none;
  flex-direction:column;
  height:100%;
  overflow:hidden;
}
#screenNowPlaying.active{display:flex;}
/* ── Now Playing: iPhone default (original, unverändert) ── */
.np-header{position:absolute;top:0;left:0;right:0;height:0;z-index:5}
.np-down-btn{position:absolute;left:18px;top:82px;background:none;border:none;cursor:pointer;color:rgba(133,172,201,.72);padding:4px;display:flex;z-index:9999}
.np-down-btn svg{width:28px;height:28px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.np-album-label{
  position:absolute;left:0;right:0;top:152px;text-align:center;
  font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(133,172,201,.45);
  transition:opacity .2s;
}
#screenNowPlaying.lyrics-open .np-album-label{ opacity:0; pointer-events:none; }
/* Swipeable cover area */
.np-cover-wrap{
  display:flex;align-items:center;justify-content:center;
  padding:126px 20px 0;
  touch-action:manipulation;
  user-select:none;
  flex-shrink:0;
}

/* ── Now Playing: iPad (≥600px) – Album-Label im Flex-Flow, kein Overlap ── */
@media(min-width:600px){
  .np-header{position:relative;width:100%;height:auto;flex-shrink:0;overflow:visible}
  .np-down-btn{top:14px}
  .np-album-label{
    position:static;
    display:block;
    padding:75px 20px 0;
    flex-shrink:0;
  }
  .np-cover-wrap{
    padding:20px 20px 0;
  }
}
.np-cover{
  width:min(58vh,88vw);height:min(58vh,88vw);
  border-radius:12px;object-fit:cover;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
  background:#0B2A42;
  transition:transform .18s ease,opacity .18s ease;
  display:block;
  will-change:transform;
}
.np-cover.swipe-left{transform:translateX(-60px);opacity:0}
.np-cover.swipe-right{transform:translateX(60px);opacity:0}
.np-cover.lyrics-active{touch-action:none;}
.np-cover.lyrics-active.no-transition{transition:none!important;}
.np-cover-wrap.lyrics-mode{touch-action:none;}
/* Song info below cover */
.np-info{text-align:center;padding:24px 24px 0;flex-shrink:0}
.np-title{font-size:20px;font-weight:700;color:#cfe5f5;margin-bottom:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-artist{font-size:14px;color:rgba(133,172,201,.6)}
/* Bottom section: pushed well down */
.np-bottom{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:0 0 calc(env(safe-area-inset-bottom, 0px) + 14px);
}
/* Progress */
.np-prog-wrap{margin:0 24px;height:3px;background:rgba(133,172,201,.18);border-radius:2px;cursor:pointer;flex-shrink:0}
.np-prog-fill{height:100%;background:#85ACC9;border-radius:2px;width:0%;transition:width .1s linear;pointer-events:none}
.np-time{display:flex;justify-content:space-between;padding:8px 24px 0;font-size:12px;color:rgba(133,172,201,.85);font-variant-numeric:tabular-nums;flex-shrink:0}
/* NP Controls */
.np-controls{display:flex;align-items:center;justify-content:space-between;padding:24px 16px 0;flex-shrink:0}
.np-btn{background:none;border:none;cursor:pointer;color:rgba(133,172,201,.55);display:flex;align-items:center;justify-content:center;border-radius:50%;padding:10px;position:relative;transition:color .15s,transform .1s}
.np-btn:active{transform:scale(.84)}
.np-btn svg{display:block;width:26px;height:26px;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;fill:none}
.np-btn.filled svg{fill:currentColor;stroke:none}
.np-btn.active{color:#85ACC9}
.np-btn.active::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#85ACC9}
.np-btn-play{width:62px;height:62px;background:#85ACC9;border-radius:50%;color:#02111E;flex-shrink:0;box-shadow:0 4px 20px rgba(133,172,201,.3);padding:0;transition:background .15s,transform .1s}
.np-btn-play:active{transform:scale(.9)}
.np-btn-play svg{width:28px;height:28px;fill:currentColor;stroke:none}
.np-btn-play .icon-pause{display:none}
.np-btn-play.playing .icon-play{display:none}
.np-btn-play.playing .icon-pause{display:block}
.np-btn-repeat .icon-rpt-all,.np-btn-repeat .icon-rpt-one{display:none}
.np-btn-repeat.repeat-all .icon-rpt-off{display:none}
.np-btn-repeat.repeat-all .icon-rpt-all{display:block}
.np-btn-repeat.repeat-one .icon-rpt-off{display:none}
.np-btn-repeat.repeat-one .icon-rpt-one{display:block}

/* ══ PLAYER BAR ══ */
.hj-player{
  position:fixed;bottom:0;left:0;right:0;
  z-index:200;
  display:flex;flex-direction:column;
  background:rgba(6,20,32,1);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transform:translateY(100%);
  transition:transform .3s ease;
  pointer-events:none;
}
.hj-player.visible{
  transform:translateY(0);
  pointer-events:auto;
}
/* Upper now-playing strip: slightly lighter */
.hj-now-strip{
  background:rgba(18,48,72,.98);
  border-top:1px solid rgba(133,172,201,.18);
  cursor:pointer;
}
.hj-prog-wrap{height:2px;background:rgba(133,172,201,.15)}
.hj-prog-fill{height:100%;background:#85ACC9;width:0%;transition:width .1s linear}
.hj-now{display:flex;align-items:center;gap:12px;padding:10px 16px}
.hj-now-num{width:24px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end}
.hj-now-numtxt{display:none}
.hj-now-cover{width:52px;height:52px;border-radius:5px;object-fit:cover;background:#0B2A42;flex-shrink:0}
.hj-now-info{flex:1;min-width:0}
.hj-now-title{font-size:17px;font-weight:500;color:#85ACC9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hj-now-artist{font-size:13px;color:rgba(133,172,201,.5);margin-top:2px}
/* Lower controls strip: compact, anchored to the physical bottom */
.hj-controls-strip{
  background:transparent;
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
.hj-time{display:flex;justify-content:space-between;padding:10px 20px 0;font-size:11px;color:rgba(133,172,201,.85);font-variant-numeric:tabular-nums}
.hj-controls{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 18px}

.hj-btn{background:none;border:none;cursor:pointer;color:rgba(133,172,201,.55);display:flex;align-items:center;justify-content:center;border-radius:50%;padding:9px;position:relative;transition:color .15s,transform .1s}
.hj-btn:active{transform:scale(.84)}
.hj-btn:hover{color:rgba(207,229,245,.9)}
.hj-btn svg{display:block;width:25px;height:25px;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;fill:none}
.hj-btn.filled svg{fill:currentColor;stroke:none}
.hj-btn.active{color:#85ACC9}
.hj-btn.active::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#85ACC9}
.hj-btn-play{width:54px;height:54px;background:#85ACC9;border-radius:50%;color:#02111E;flex-shrink:0;box-shadow:0 4px 18px rgba(133,172,201,.28);transition:background .15s,transform .1s;padding:0}
.hj-btn-play:active{transform:scale(.9)}
.hj-btn-play:hover{background:#a8c8de}
.hj-btn-play svg{width:24px;height:24px;fill:currentColor;stroke:none}
.hj-btn-play .icon-pause{display:none}
.hj-btn-play.playing .icon-play{display:none}
.hj-btn-play.playing .icon-pause{display:block}
.hj-btn-repeat .icon-rpt-all,.hj-btn-repeat .icon-rpt-one{display:none}
.hj-btn-repeat.repeat-all .icon-rpt-off{display:none}
.hj-btn-repeat.repeat-all .icon-rpt-all{display:block}
.hj-btn-repeat.repeat-one .icon-rpt-off{display:none}
.hj-btn-repeat.repeat-one .icon-rpt-one{display:block}

/* iPhone PWA bottom anchoring: fill the Home Indicator area without lifting the buttons */
.hj-player::after{
  content:'';
  position:absolute;
  left:0;right:0;bottom:calc(-1 * env(safe-area-inset-bottom, 0px));
  height:env(safe-area-inset-bottom, 0px);
  background:rgba(6,20,32,1);
}


/* ══ FEATURED TEASER ══ */
.featured-teaser {
  grid-column: 1 / -1;
  position: relative;
  aspect-ratio: 2 / 1;
  background: #f1ecdf;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .13s, opacity .13s;
  -webkit-tap-highlight-color: transparent;
}
.featured-teaser:active { transform: scale(.97); opacity: .9; }

/* The big black circle — centered, 85% of height, offset slightly right */
.ft-circle {
  position: absolute;
  width: 85%;
  aspect-ratio: 1 / 1;
  background: #0a0a0a;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-18%, -50%);
  z-index: 1;
}

/* Song cover images inside the circle — clipped by it */
.ft-covers {
  position: absolute;
  width: 85%;
  aspect-ratio: 1 / 1;
  top: 50%;
  left: 50%;
  transform: translate(-18%, -50%);
  border-radius: 50%;
  overflow: hidden;
  z-index: 2;
}
.ft-covers img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: opacity .6s ease;
  border-radius: 50%;
}
.ft-covers img.active { opacity: 1; }

/* Text overlay — in front of everything, uses mix-blend-mode */
.ft-text {
  position: absolute;
  top: 5%;
  left: 4%;
  right: 4%;
  z-index: 3;
  display: flex;
  flex-direction: column;
  pointer-events: none;
}
.ft-label {
  font-family: 'Anton', sans-serif;
  font-size: clamp(11px, 2.2vw, 18px);
  letter-spacing: .22em;
  text-transform: uppercase;
  color: #f1ecdf;
  mix-blend-mode: difference;
  line-height: 1;
  margin-bottom: clamp(8px, 2vw, 20px);
  margin-left: 0;
}
.ft-title-line {
  font-family: 'Anton', sans-serif;
  font-size: clamp(28px, 8vw, 90px);
  line-height: .97;
  text-transform: uppercase;
  color: #0a0a0a;
  mix-blend-mode: difference;
  letter-spacing: -.01em;
}
.ft-title-line:nth-child(2) { margin-left: 0; }      /* Auf */
.ft-title-line:nth-child(3) { margin-left: 7%; }     /* der — e startet über Mitte des e von Über */
.ft-title-line:nth-child(4) { margin-left: 1.5%; }   /* Über */
.ft-title-line:nth-child(5) { margin-left: 0; }      /* holspur — ganz links */

/* Right side: song title — creme text, black shadow */
.ft-song-name {
  position: absolute;
  right: 3%;
  bottom: 18%;
  z-index: 4;
  text-align: right;
  pointer-events: none;
  max-width: 55%;
}
.ft-song-title {
  font-family: 'Anton', sans-serif;
  font-size: clamp(17px, 3.6vw, 38px);
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #f1ecdf;
  text-shadow:
    0 1px 4px rgba(0,0,0,.95),
    0 2px 14px rgba(0,0,0,.8),
    -1px -1px 0 rgba(0,0,0,.7),
     1px -1px 0 rgba(0,0,0,.7),
    -1px  1px 0 rgba(0,0,0,.7),
     1px  1px 0 rgba(0,0,0,.7);
  line-height: 1.15;
}
.ft-song-artist { display: none; }
.ft-song-num {
  font-family: 'Anton', sans-serif;
  font-size: clamp(10px, 1.5vw, 16px);
  letter-spacing: .15em;
  color: rgba(241,236,223,.65);
  text-shadow: 0 1px 4px rgba(0,0,0,.9);
  margin-top: clamp(3px, .5vw, 5px);
}

/* Dots — am unteren Rand mit Luft */
.ft-dots {
  position: absolute;
  bottom: 8%;
  left: 4%;
  z-index: 4;
  display: flex;
  gap: 6px;
  mix-blend-mode: difference;
}
.ft-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #f1ecdf;
  opacity: .3;
  transition: opacity .3s, background .3s;
}
.ft-dot.active { opacity: 1; background: #f1ecdf; }
}
}
.ft-dot.active { opacity: 1; }

/* Blank intro slide — zeigt nur den schwarzen Kreis */
.ft-covers img.ft-blank { opacity: 0 !important; }
.ft-covers img.ft-blank.active { opacity: 0 !important; }
@keyframes ft-spin-in {
  from { opacity: 0; transform: scale(1.04); }
  to   { opacity: 1; transform: scale(1); }
}

</style>




</head>
<body>

<!-- Header -->
<div class="hj-header" id="mainHeader">
  <div class="hj-back-btn" id="backBtn">
    <svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg>
    <span>Alben</span>
  </div>
  <div class="hj-logo" id="logoHome">
    <span class="hj-logo-hit">hit</span><span class="hj-logo-journey">journey</span>
  </div>
  <span class="hj-logo-sub" id="makingWaves">making waves</span>
  <div class="hj-header-right" id="headerRight"></div>
</div>

<!-- HOME -->
<div class="screen active" id="screenHome">
  <div class="home-grid">
    <div class="home-card square" data-album="grad30">
      <img src="https://hitjourney.s3.eu-west-1.amazonaws.com/artwork/30%20Grad%20-%20Cover.jpg" alt="30° Grad" loading="eager"/>
    </div>
    <div class="home-card square" data-album="stories30">

// ── Helpers ──
function fmt(s){if(!isFinite(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec;}
function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildQueue(keep){
  const idxs=ALBUMS[curAlbum].songs.map((_,i)=>i);
  if(!shuffleOn)return idxs;
  const q=shuffleArr(idxs);
  if(keep!==undefined){const p=q.indexOf(keep);if(p>0){q.splice(p,1);q.unshift(keep);}}
  return q;
}

function getImgUrls(song, field){
  if(!song)return [];
  const extra = song[field + 'Candidates'] || [];
  return [song[field], ...extra].filter((v,i,a)=>v && a.indexOf(v)===i);
}
function setImgSrcWithFallback(img, urls){
  if(!img)return;
  const list = (Array.isArray(urls) ? urls : [urls]).filter(Boolean);
  img.onerror = null;
  img.removeAttribute('data-fallback-index');
  img.removeAttribute('data-fallback-list');
  if(!list.length){ img.removeAttribute('src'); return; }
  img.dataset.fallbackIndex = '0';
  img.dataset.fallbackList = JSON.stringify(list);
  img.onerror = function(){
    const stored = JSON.parse(this.dataset.fallbackList || '[]');
    const next = Number(this.dataset.fallbackIndex || 0) + 1;
    if(next < stored.length){
      this.dataset.fallbackIndex = String(next);
      this.src = stored[next];
    } else {
      this.onerror = null;
    }
  };
  img.src = list[0];
}

function normalizeLyricsTitle(title) {
  return String(title || '')
    .replace(/[’‘´`]/g,"'")
    .replace(/Ä/g,'ae').replace(/Ö/g,'oe').replace(/Ü/g,'ue')
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function getLyricsUrlsForSong(song) {
  if(!song) return [];
  const existing = getImgUrls(song,'lyrics');
  if(existing.length) return existing;
  const fallback = LYRICS_BY_TITLE[normalizeLyricsTitle(song.title)];
  return fallback ? [fallback] : [];
}


// ── Navigation ──
function showHome(){
  screenHome.classList.add('active');
  screenTL.classList.remove('active');
  screenArchive.classList.remove('active');
  screenNP.classList.remove('active');
  backBtn.classList.remove('visible');
  logoHome.style.display='';
  makingWaves.style.display='';
  headerRight.textContent='';
  mainHeader.style.display='';
  prevScreen='home';
}
function showAlbum(key){
  const alb=ALBUMS[key]; curAlbum=key;
  setImgSrcWithFallback(tlCover, [alb.cover]); tlTitle.textContent=alb.title; tlMeta.textContent=alb.meta;
  tlList.innerHTML='';
  alb.songs.forEach((s,i)=>{
    const row=document.createElement('div');
    row.className='tl-track'; row.dataset.idx=i;
    row.innerHTML=
      '<div class="tl-num-wrap"><span class="tl-track-num">'+(i+1)+'</span>'+
      '<div class="tl-bars"><div class="tl-bar"></div><div class="tl-bar"></div><div class="tl-bar"></div><div class="tl-bar"></div></div></div>'+
      '<img class="tl-thumb" loading="lazy" alt=""/>'+
      '<div class="tl-info"><div class="tl-title">'+s.title+'</div><div class="tl-artist">BRO · Jörn Kämper</div></div>';
    setImgSrcWithFallback(row.querySelector('.tl-thumb'), getImgUrls(s,'cover'));
    row.addEventListener('click',()=>playIdx(i));
    tlList.appendChild(row);
  });
  screenHome.classList.remove('active');
  screenNP.classList.remove('active');
  screenArchive.classList.remove('active');
  screenTL.classList.add('active');
  backBtn.classList.add('visible');
  logoHome.style.display='none';
  makingWaves.style.display='none';
  headerRight.textContent=alb.title;
  mainHeader.style.display='';
  screenTL.scrollTop=0;
  previewSong(0);
  showNowStrip();
  playerBar.classList.add('visible');
  refreshHighlight();
  prevScreen='tracklist';
}
function showNowPlaying(){
  if(!curAlbum) return;
  screenHome.classList.remove('active');
  screenTL.classList.remove('active');
  screenArchive.classList.remove('active');
  screenNP.classList.add('active');
  mainHeader.style.display='none';
  playerBar.classList.remove('visible');
  updateNPScreen();
}
function hideNowPlaying(){
  mainHeader.style.display='';
  if(audio.src) playerBar.classList.add('visible');
  screenNP.classList.remove('active');
  if(prevScreen==='home'){ screenHome.classList.add('active'); }
  else if(prevScreen==='archive'){ screenArchive.classList.add('active'); }
  else { screenTL.classList.add('active'); }
}

document.querySelectorAll('[data-album]').forEach(el=>el.addEventListener('click',()=>showAlbum(el.dataset.album)));
backBtn.addEventListener('click',()=>{
  if(screenNP.classList.contains('active')) hideNowPlaying();
  else showHome();
});
logoHome.addEventListener('click',showHome);
// nowStrip tap → showNowPlaying handled in swipe block below
npDownBtn.addEventListener('click', hideNowPlaying);

// ── Now Playing screen update ──
function updateNPScreen(){
  if(queueIdx<0&&arcQueueIdx<0)return;
  let s;
  if(isArchiveMode()){
    s=arcQueue[arcQueueIdx];
    npAlbumLabel.textContent='the archive';
  } else {
    if(!curAlbum||queueIdx<0)return;
    s=ALBUMS[curAlbum].songs[queue[queueIdx]];
    npAlbumLabel.textContent=ALBUMS[curAlbum].title;
  }
  setImgSrcWithFallback(npCover, getImgUrls(s,'cover'));
  npTitle.textContent=s.title;
  npBtnPlay.classList.toggle('playing',!audio.paused);
  npBtnShuffle.classList.toggle('active',shuffleOn);
  syncRepeatBtn(npBtnRepeat);
}

function isArchiveMode(){
  return prevScreen==='archive' && arcQueue.length>0 && arcQueueIdx>=0;
}

function loadArchiveSongByIndex(idx){
  featuredMode = false; // Featured-Modus beenden
  if(!arcQueue.length)return;
  arcQueueIdx=(idx+arcQueue.length)%arcQueue.length;
  const s=arcQueue[arcQueueIdx];
  curAlbum=s.albumKey||curAlbum;
  queueIdx=-1;
  if(lyricsOpen) closeLyrics();
  audio.src=s.mp3; audio.load(); audio.play().catch(()=>{});
  setImgSrcWithFallback(nowCover, getImgUrls(s,'cover')); nowTitle.textContent=s.title;
  nowNum.textContent=arcQueueIdx+1;
  showNowStrip();
  if(!screenNP.classList.contains('active')) playerBar.classList.add('visible');
  refreshArchiveHighlight();
  updateMS_archive(s);
  if(screenNP.classList.contains('active')) updateNPScreen();
}

function refreshArchiveHighlight(){
  document.querySelectorAll('#arcList .tl-track').forEach(row=>{
    const i=parseInt(row.dataset.arcIdx);
    row.classList.toggle('active',i===arcQueueIdx);
    row.classList.toggle('playing',i===arcQueueIdx&&!audio.paused);
  });
  const active=arcList.querySelector('.tl-track.active');
  if(active)active.scrollIntoView({behavior:'smooth',block:'nearest'});
}

  const song = isArchiveMode()
    ? arcQueue[arcQueueIdx]
    : (curAlbum && queueIdx >= 0 ? ALBUMS[curAlbum].songs[queue[queueIdx]] : null);
  const lyricsUrls = getLyricsUrlsForSong(song);
  if (!song || !lyricsUrls.length) return;
  lyricsCoverSrc = npCoverImg.src;
  setImgSrcWithFallback(npCoverImg, lyricsUrls);
  npCoverImg.classList.add('lyrics-active');
  npCoverWrap.classList.add('lyrics-mode');
  screenNP.classList.add('lyrics-open');
  npTransX = 0; npTransY = 0;
  npCoverImg.style.transform = 'scale(1)';
  npPinchScale = 1; npPinchLast = 1;
  lyricsOpen = true;
}

function closeLyrics() {
  npCoverImg.src = lyricsCoverSrc;
  npCoverImg.classList.remove('lyrics-active');
  npCoverWrap.classList.remove('lyrics-mode');
  screenNP.classList.remove('lyrics-open');
  npTransX = 0; npTransY = 0;
  npCoverImg.style.transform = 'scale(1)';
  npPinchScale = 1; npPinchLast = 1;
  lyricsOpen = false;
}

npCoverWrap.addEventListener('touchstart',e=>{
  swipeStartX=e.touches[0].clientX;
  swipeStartY=e.touches[0].clientY;
  if(e.touches.length===2 && lyricsOpen){
    npPinching=true;
    npDragging=false;
    npPinchDist0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    npPinchLast=npPinchScale;
    e.preventDefault();
  } else if(e.touches.length===1 && lyricsOpen && npPinchScale>1){
    npDragging=true;
    npDragStartX=e.touches[0].clientX - npTransX;
    npDragStartY=e.touches[0].clientY - npTransY;
    npCoverImg.classList.add('no-transition');
    e.preventDefault();
  }
},{passive:false});

npCoverWrap.addEventListener('touchmove',e=>{
  if(npPinching && e.touches.length===2 && lyricsOpen){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    npPinchScale=Math.min(Math.max(npPinchLast*(d/npPinchDist0),0.9),4.0);
    applyLyricsTransform();
    e.preventDefault();
  } else if(npDragging && e.touches.length===1 && lyricsOpen && npPinchScale>1){
    npTransX=e.touches[0].clientX - npDragStartX;
    npTransY=e.touches[0].clientY - npDragStartY;
    applyLyricsTransform();
    e.preventDefault();
  }
},{passive:false});

npCoverWrap.addEventListener('touchend',e=>{
  if(npDragging && e.touches.length===0){
    npDragging=false;
    npCoverImg.classList.remove('no-transition');
    return;
  }
  if(npPinching){
    if(e.touches.length<2){
      if(npPinchScale<1){npPinchScale=1;npTransX=0;npTransY=0;applyLyricsTransform();}
      setTimeout(()=>{npPinching=false;},80);
    }
    return;
  }
  const dx=e.changedTouches[0].clientX-swipeStartX;
  const dy=e.changedTouches[0].clientY-swipeStartY;
  const absDx=Math.abs(dx), absDy=Math.abs(dy);
  if(absDx<12&&absDy<12){ // TAP
    if(lyricsOpen) closeLyrics();
    else openLyrics();
  } else if(dy>60&&absDy>absDx*1.2){ // swipe down
    if(lyricsOpen) closeLyrics();
    else hideNowPlaying();
  } else if(!lyricsOpen && absDx>absDy*1.5&&absDx>40){ // swipe left/right — nur ohne Lyrics
    if(dx<0){
      npCoverImg.classList.add('swipe-left');
      setTimeout(()=>{npCoverImg.classList.remove('swipe-left');btnNext.click();},180);
    } else {
      npCoverImg.classList.add('swipe-right');
      setTimeout(()=>{npCoverImg.classList.remove('swipe-right');btnPrev.click();},180);
    }
  }
},{passive:true});

// ── NP screen buttons mirror bar buttons ──
npBtnPlay.addEventListener('click',()=>btnPlay.click());
npBtnPrev.addEventListener('click',()=>btnPrev.click());
npBtnNext.addEventListener('click',()=>btnNext.click());
npBtnShuffle.addEventListener('click',()=>btnShuffle.click());
npBtnRepeat.addEventListener('click',()=>btnRepeat.click());
const npProgWrap = document.getElementById('npProgWrap');
npProgWrap && npProgWrap.addEventListener('click',e=>{
  const r=npProgWrap.getBoundingClientRect();
  if(!audio.duration)return;
  audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
});

// ── Swipe on Player-Bar strip → Prev / Next ──
let stripStartX=0, stripStartY=0, stripTouchMoved=false;
nowStrip.addEventListener('touchstart',e=>{
  stripStartX=e.touches[0].clientX;
  stripStartY=e.touches[0].clientY;
  stripTouchMoved=false;
},{passive:true});
nowStrip.addEventListener('touchmove',e=>{
  stripTouchMoved=true;
},{passive:true});
nowStrip.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-stripStartX;
  const dy=e.changedTouches[0].clientY-stripStartY;
  if(Math.abs(dx)>Math.abs(dy)*1.5&&Math.abs(dx)>40){
    if(dx<0){ btnNext.click(); } // swipe left → next
    else     { btnPrev.click(); } // swipe right → prev
  } else if(!stripTouchMoved){
    showNowPlaying(); // kein Swipe → normaler Tap → NP öffnen
  }
},{passive:true});

// ── Playback ──
function previewSong(i){
  const s=ALBUMS[curAlbum].songs[i];
  setImgSrcWithFallback(nowCover, getImgUrls(s,'cover')); nowTitle.textContent=s.title;
  nowNum.textContent=i+1;
}
function showNowStrip(){
  nowCover.style.visibility='';
  document.getElementById('nowInfo').style.visibility='';
}
function playIdx(songIdx){
  arcQueue=[]; arcQueueIdx=-1;
  let pos=queue.indexOf(songIdx);
  if(pos===-1){queue=buildQueue(songIdx);pos=queue.indexOf(songIdx);}
  queueIdx=pos; loadPlay(songIdx);
}
function loadPlay(songIdx){
  featuredMode = false; // Featured-Modus beenden
  const s=ALBUMS[curAlbum].songs[songIdx];
  if(lyricsOpen) closeLyrics();
  audio.src=s.mp3; audio.load(); audio.play().catch(()=>{});
  setImgSrcWithFallback(nowCover, getImgUrls(s,'cover')); nowTitle.textContent=s.title;
  nowNum.textContent=songIdx+1;
  showNowStrip();
  if(!screenNP.classList.contains('active')) playerBar.classList.add('visible');
  refreshHighlight(); updateMS(songIdx);
  if(screenNP.classList.contains('active')) updateNPScreen();
}
function refreshHighlight(){
  const cur=queueIdx>=0?queue[queueIdx]:-1;
  document.querySelectorAll('.tl-track').forEach(row=>{
    const i=parseInt(row.dataset.idx);
    row.classList.toggle('active',i===cur);
    row.classList.toggle('playing',i===cur&&!audio.paused);
  });
  const active=tlList.querySelector('.tl-track.active');
  if(active)active.scrollIntoView({behavior:'smooth',block:'nearest'});
}
let featuredMode = false; // true = Fokus-Song läuft, kein Player-Strip

function updatePlayBtns(){
  if(featuredMode) return; // Featured-Modus: Strip bleibt versteckt
  const p=!audio.paused;
  btnPlay.classList.toggle('playing',p);
  npBtnPlay.classList.toggle('playing',p);
  refreshHighlight();
  refreshArchiveHighlight();
}
function syncRepeatBtn(btn){
  btn.classList.remove('repeat-all','repeat-one','active');
  if(repeatMode==='all') btn.classList.add('repeat-all','active');
  else if(repeatMode==='one') btn.classList.add('repeat-one','active');
}

// ── Audio events ──
audio.addEventListener('play', updatePlayBtns);
audio.addEventListener('pause',updatePlayBtns);
audio.addEventListener('timeupdate',()=>{
  if(!audio.duration)return;
  const pct=(audio.currentTime/audio.duration*100)+'%';
  progFill.style.width=pct;
  npProgFill.style.width=pct;
  const e=fmt(audio.currentTime), r='-'+fmt(audio.duration-audio.currentTime);
  tElapsed.textContent=e; tRemain.textContent=r;
  npElapsed.textContent=e; npRemain.textContent=r;
});
audio.addEventListener('ended',()=>{
  if(repeatMode==='one'){audio.currentTime=0;audio.play().catch(()=>{});return;}
  if(isArchiveMode()){
    const next=arcQueueIdx+1;
    if(next>=arcQueue.length && repeatMode!=='all'){updatePlayBtns();return;}
    loadArchiveSongByIndex(next);
    return;
  }
  let next=queueIdx+1;
  if(next>=queue.length){
    if(repeatMode==='all'){if(shuffleOn)queue=buildQueue();next=0;}
    else{updatePlayBtns();return;}
  }
  queueIdx=next; loadPlay(queue[queueIdx]);
});

// ── Controls ──
btnPlay.addEventListener('click',()=>{
  if(isArchiveMode()){
    audio.paused?audio.play().catch(()=>{}):audio.pause();
    return;
  }
  if(!curAlbum)return;
  if(queueIdx===-1){queue=buildQueue();queueIdx=0;loadPlay(queue[0]);return;}
  audio.paused?audio.play().catch(()=>{}):audio.pause();
});
btnPrev.addEventListener('click',()=>{
  if(isArchiveMode()){
    if(audio.currentTime>3){audio.currentTime=0;if(audio.paused)audio.play().catch(()=>{});return;}
    loadArchiveSongByIndex(arcQueueIdx-1);
    return;
  }
  if(queueIdx===-1)return;
  if(audio.currentTime>3){audio.currentTime=0;if(audio.paused)audio.play().catch(()=>{});return;}
  queueIdx=queueIdx>0?queueIdx-1:queue.length-1;
  loadPlay(queue[queueIdx]);
});
btnNext.addEventListener('click',()=>{
  if(isArchiveMode()){
    loadArchiveSongByIndex(arcQueueIdx+1);
    return;
  }
  if(!curAlbum)return;
  if(queueIdx===-1){queue=buildQueue();queueIdx=0;}
  else queueIdx=(queueIdx+1)%queue.length;
  loadPlay(queue[queueIdx]);
});
btnShuffle.addEventListener('click',()=>{
  shuffleOn=!shuffleOn;
  btnShuffle.classList.toggle('active',shuffleOn);
  npBtnShuffle.classList.toggle('active',shuffleOn);
  if(isArchiveMode()){
    const current=arcQueue[arcQueueIdx];
    if(shuffleOn){
      arcQueue=shuffleArr(arcQueue);
      arcQueueIdx=arcQueue.findIndex(s=>s.mp3===current.mp3);
      if(arcQueueIdx>0){arcQueue.splice(arcQueueIdx,1);arcQueue.unshift(current);arcQueueIdx=0;}
    } else {
      arcQueue=ALL_SONGS.slice();
      arcQueueIdx=arcQueue.findIndex(s=>s.mp3===current.mp3);
    }
    refreshArchiveHighlight();
    updateNPScreen();
    return;
  }
  if(!curAlbum)return;
  if(shuffleOn){
    queue=shuffleArr(ALBUMS[curAlbum].songs.map((_,i)=>i));
    queueIdx=0; loadPlay(queue[0]);
  } else {
    const cur=queueIdx>=0?queue[queueIdx]:undefined;
    queue=buildQueue(cur);
    if(cur!==undefined)queueIdx=queue.indexOf(cur);
  }
});
btnRepeat.addEventListener('click',()=>{
  repeatMode=repeatMode==='off'?'all':repeatMode==='all'?'one':'off';
  syncRepeatBtn(btnRepeat);
  syncRepeatBtn(npBtnRepeat);
});

// Progress bar
document.querySelector('.hj-prog-wrap').addEventListener('click',e=>{
  if(!audio.duration)return;
  const r=e.currentTarget.getBoundingClientRect();
  audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
});

// ── MediaSession ──
function updateMS(i){
  if(!('mediaSession' in navigator)||!curAlbum)return;
  const s=ALBUMS[curAlbum].songs[i];
  navigator.mediaSession.metadata=new MediaMetadata({
    title:s.title,artist:'BRO · Jörn Kämper',
    album:ALBUMS[curAlbum].title,
    artwork:[{src:s.cover,sizes:'400x400',type:'image/jpeg'}]
  });
  navigator.mediaSession.setActionHandler('play',()=>audio.play());
  navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack',()=>btnPrev.click());
  navigator.mediaSession.setActionHandler('nexttrack',()=>btnNext.click());
}

// ── Archive ──
const screenArchive = document.getElementById('screenArchive');
const arcInput      = document.getElementById('arcInput');
const arcClear      = document.getElementById('arcClear');
const arcSearchWrap = document.getElementById('arcSearchWrap');
const arcLetters    = document.getElementById('arcLetters');
const arcList       = document.getElementById('arcList');

// Build flat list of all unique songs from every album, sorted A→Z
function buildAllSongs(){
  const seen = new Set();
  const all = [];
  const albumOrder = ['top50','grad30','stories30','grosseLiebe','poesie','buriedDiamonds','top100'];
  albumOrder.forEach(key=>{
    ALBUMS[key].songs.forEach(s=>{
      const id = s.mp3; // use mp3 URL as unique key
      if(!seen.has(id)){ seen.add(id); all.push({...s, albumKey:key}); }
    });
  });
  all.sort((a,b)=>a.title.localeCompare(b.title,'de',{sensitivity:'base'}));
  return all;
}
const ALL_SONGS = buildAllSongs();

// Letter strip: 3 rows × 9 cols
const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const availLetters = [...new Set(ALL_SONGS.map(s=>s.title[0].toUpperCase()))].sort();
ALPHABET.forEach(l=>{
  const el = document.createElement('span');
  const available = availLetters.includes(l);
  el.className = 'arc-letter' + (available ? '' : ' dim');
  el.textContent = l;
  el.addEventListener('click',()=>scrollToLetter(l));
  arcLetters.appendChild(el);
});
// pad to 27 cells (3 rows × 9)
for(let i=ALPHABET.length; i<27; i++){
  const sp=document.createElement('span');
  sp.className='arc-letter';
  arcLetters.appendChild(sp);
}

function renderArchiveList(songs){
  arcList.innerHTML='';
  if(!songs.length){
    arcList.innerHTML='<div class="arc-no-results">Kein Song gefunden</div>';
    return;
  }
  let lastLabel='';
  songs.forEach((s,i)=>{
    const firstChar = s.title[0].toUpperCase();
    const label = /[A-Z]/.test(firstChar) ? firstChar : '#';
    if(label!==lastLabel){
      lastLabel=label;
      const lbl=document.createElement('div');
      lbl.className='arc-section-label';
      lbl.dataset.letter=label;
      lbl.textContent=label;
      arcList.appendChild(lbl);
    }
    const row=document.createElement('div');
    row.className='tl-track'; row.dataset.arcIdx=i;
    row.innerHTML=
      '<div class="tl-num-wrap"><span class="tl-track-num">'+(i+1)+'</span>'+
      '<div class="tl-bars"><div class="tl-bar"></div><div class="tl-bar"></div><div class="tl-bar"></div><div class="tl-bar"></div></div></div>'+
      '<img class="tl-thumb" loading="lazy" alt=""/>'+
      '<div class="tl-info"><div class="tl-title">'+s.title+'</div><div class="tl-artist">BRO · Jörn Kämper</div></div>';
    setImgSrcWithFallback(row.querySelector('.tl-thumb'), getImgUrls(s,'cover'));
    row.addEventListener('click',()=>playArchiveSong(i,songs));
    arcList.appendChild(row);
  });
}

function playArchiveSong(idx, songList){
  // build queue from the currently visible archive/search result list
  arcQueue = songList.map(s=>s);
  arcQueueIdx = idx;
  prevScreen='archive';
  loadArchiveSongByIndex(idx);
}
function updateMS_archive(s){
  if(!('mediaSession' in navigator))return;
  navigator.mediaSession.metadata=new MediaMetadata({
    title:s.title,artist:'BRO · Jörn Kämper',album:'the archive',
    artwork:[{src:s.cover,sizes:'400x400',type:'image/jpeg'}]
  });
  navigator.mediaSession.setActionHandler('play',()=>audio.play());
  navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack',()=>btnPrev.click());
  navigator.mediaSession.setActionHandler('nexttrack',()=>btnNext.click());
}

function scrollToLetter(l){
  arcInput.value=''; arcSearchWrap.classList.remove('has-value');
  renderArchiveList(ALL_SONGS);
  setTimeout(()=>{
    // Try exact label first, then scan forward for next available
    let target = arcList.querySelector('[data-letter="'+l+'"]');
    if(!target){
      // find next label after l alphabetically
      const all = [...arcList.querySelectorAll('[data-letter]')];
      target = all.find(el => el.dataset.letter > l) || all[all.length-1];
    }
    if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
  },50);
}

arcInput.addEventListener('input',()=>{
  const q=arcInput.value.trim().toLowerCase();
  arcSearchWrap.classList.toggle('has-value',q.length>0);
  const filtered = q ? ALL_SONGS.filter(s=>s.title.toLowerCase().includes(q)) : ALL_SONGS;
  renderArchiveList(filtered);
  document.getElementById('arcSongCount').textContent = filtered.length + ' songs';
});
arcClear.addEventListener('click',()=>{
  arcInput.value='';
  arcSearchWrap.classList.remove('has-value');
  renderArchiveList(ALL_SONGS);
  document.getElementById('arcSongCount').textContent = ALL_SONGS.length + ' songs';
  arcInput.focus();
});

function showArchive(){
  renderArchiveList(ALL_SONGS);
  screenHome.classList.remove('active');
  screenTL.classList.remove('active');
  screenNP.classList.remove('active');
  screenArchive.classList.add('active');
  backBtn.classList.add('visible');
  logoHome.style.display='none';
  makingWaves.style.display='none';
  headerRight.textContent='the archive';
  headerRight.style='';
  mainHeader.style.position='';
  mainHeader.style.display='';
  screenArchive.scrollTop=0;
  document.getElementById('arcSongCount').textContent = ALL_SONGS.length + ' songs';
  prevScreen='archive';
}
function hideArchive(){
  screenArchive.classList.remove('active');
  arcInput.value='';
  arcSearchWrap.classList.remove('has-value');
  showHome();
}

document.getElementById('archiveCard').addEventListener('click',showArchive);

// Back button: archive → home (runs before existing TL → home handler, guard by active check)
backBtn.addEventListener('click',()=>{
  if(screenArchive.classList.contains('active')) hideArchive();
});
</script>

  function stopRotation() {
    clearInterval(timer);
  }

  if(titleEl)  titleEl.textContent  = '';
  if(artistEl) artistEl.textContent = '';
  if(numEl)    numEl.textContent    = '';
  startRotation();

  // Tap auf Teaser → Song im Hintergrund, kein Player-Strip
  let featuredCurrentMp3 = null;

  teaser.addEventListener('click', () => {
    const song = FEATURED_SONGS[current];
    if(!song.mp3) return; // Intro-Slide

    // Derselbe Song läuft gerade → pause/play toggle
    if(featuredCurrentMp3 === song.mp3) {
      if(audio.paused) {
        audio.play().catch(()=>{});
      } else {
        audio.pause();
      }
      return;
    }

    // Neuer Song → Featured-Modus, kein Strip, kein PlayerBar
    featuredMode = true;
    featuredCurrentMp3 = song.mp3;
    playerBar.classList.remove('visible'); // sicherheitshalber verstecken
    audio.src = song.mp3;
    audio.load();
    audio.play().catch(()=>{});
  });

  // Wenn normaler Player woanders übernimmt → Featured-Modus beenden
  audio.addEventListener('play', () => {
    if(featuredMode && audio.src !== featuredCurrentMp3) {
      featuredMode = false;
      featuredCurrentMp3 = null;
    }
  });

  // Swipe left/right on teaser
  let touchX = null;
  teaser.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; stopRotation(); }, {passive:true});
  teaser.addEventListener('touchend',   e => {
    if(touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if(Math.abs(dx) > 30) goTo(current + (dx < 0 ? 1 : -1));
    touchX = null;
    startRotation();
  }, {passive:true});
})();

</script>
</body>
</html>
